# Testes em todo push/PR e o instalador do Windows como artefato do run.
# O instalador também vira uma Release no GitHub de dois jeitos:
#   - push de uma tag v* (ex.: v0.2.0);
#   - rodando o workflow na mão (Actions → Build → Run workflow) na main com
#     o campo "release" preenchido: o próprio workflow cria a tag no commit.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publicar uma release com esta tag (ex.: v0.2.0). Vazio = só gera o instalador.'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # Os testes não abrem o Electron; não precisa baixar o binário.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Roda de novo no Windows: aqui o teste da user32.dll de verdade vale.
      - run: npm test
      - run: npx electron-builder --win --x64 --publish never
      # Sem o latest.yml a atualização automática não acha a versão nova.
      - name: Conferir latest.yml
        shell: bash
        run: test -f dist/latest.yml && cat dist/latest.yml && ls -l dist/*.blockmap
      - uses: actions/upload-artifact@v4
        with:
          name: keybinds-redemptions-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release }}
        # As notas vêm de release-notes/<tag>.md, se existir; senão, a lista
        # automática de PRs do GitHub. --target cria a tag neste commit quando
        # ela ainda não existe (disparo manual).
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag inválida: $TAG (use o formato v1.2.3)"; exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "A tag $TAG não bate com a versão do package.json ($version)"; exit 1
          fi
          # latest.yml e o .blockmap são o que a atualização automática do
          # app instalado lê (electron-updater): sem eles, o app só avisa.
          test -f dist/latest.yml || { echo "dist/latest.yml não foi gerado"; exit 1; }
          files=(dist/*.exe dist/latest.yml dist/*.exe.blockmap)
          notes="release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "Keybinds Redemptions $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "Keybinds Redemptions $TAG" --generate-notes
          fi
